name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Server file is up to date
        run: python3 server/build_compose.py --check
      - name: Server scripts compile
        run: python3 -m py_compile server/setup.py server/modules/konnect_discovery.py server/build_compose.py
