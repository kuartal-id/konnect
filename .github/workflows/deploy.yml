# Builds Konnect on every push to main and publishes the static files to the `deploy` branch.
# Hostinger (hPanel → Git) serves the `deploy` branch, so a merge goes live with no terminal.
# The chat server address comes from the repository variable HOMESERVER_URL
# (GitHub → Settings → Secrets and variables → Actions → Variables). It is not a secret.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_HOMESERVER_URL: ${{ vars.HOMESERVER_URL || 'https://matrix.kuartalsystems.com' }}
      - name: Publish to deploy branch
        run: |
          cd dist
          git init -q
          git checkout -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
